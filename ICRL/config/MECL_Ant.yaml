# Native OmniSafe PPO-Lag + MECL on the installed Gymnasium/MuJoCo backend.
# Unvalidated transfer baseline; this is not a reproduction of Liu update rules.
# Native normalizers, initialization, updates, and episode-cost budget semantics apply.
# env.cost_boundary is a strict post-step x threshold (Swimmer: x >; others: x <).
# Paths are relative to this file. Runtime settings come from run/device.
clip_actions: true
method: MECL
task: Ant
group: ICRL
device: cpu
reference_config: liu/MECL_Ant.yaml
run:
  seed: 123
  constraint_seed: 0
  sampling_seed: 0
  workers: 1
  backend: modern
  solver: omnisafe
  torch_threads: 1
  output: null
env:
  train_env_id: AntWall-v0
  eval_env_id: AntWall-v0
  cost_boundary: -3.0
  max_episode_steps: 500
running:
  n_iters: 50
  n_eval_episodes: 10
  save_every: 10
  expert_rollouts: 50
  sample_rollouts: 50
  store_sample_rollouts: null
  use_buffer: false
  expert_path: ../data/expert_data/BlockedAnt
  sample_deterministic: false
  eval_deterministic: false
PPO:
  forward_timesteps: 200000
CN:
  cn_learning_rate: 0.005
  cn_reg_coeff: 0.6
  cn_layers:
  - 40
  - 40
  cn_batch_size: null
  clip_obs: 20
  cn_normalize: false
  cn_target_kl_old_new: 10
  cn_target_kl_new_old: 2.5
  train_gail_lambda: false
  cn_eps: 1.0e-05
  backward_iters: 5
  anneal_clr_by_factor: 0.9
  obs_select_dim: null
  acs_select_dim: null
  activation: relu
  optimizer_epsilon: 1.0e-05
  no_importance_sampling: false
  per_step_importance_sampling: true
omnisafe:
  algo_cfgs:
    steps_per_epoch: 10000
    update_iters: 20
    batch_size: 128
    target_kl: 0.02
    entropy_coef: 0.0
    reward_normalize: true
    cost_normalize: true
    obs_normalize: true
    kl_early_stop: true
    use_max_grad_norm: true
    max_grad_norm: 0.5
    use_critic_norm: false
    critic_norm_coef: 0.0
    gamma: 0.99
    cost_gamma: 0.99
    lam: 0.9
    lam_c: 0.9
    clip: 0.4
    adv_estimation_method: gae
    standardized_rew_adv: true
    standardized_cost_adv: true
    penalty_coef: 0.0
    use_cost: true
  model_cfgs:
    weight_initialization_mode: orthogonal
    actor_type: gaussian_learning
    linear_lr_decay: false
    exploration_noise_anneal: false
    std_range:
    - 0.5
    - 0.1
    actor:
      hidden_sizes:
      - 64
      - 64
      activation: tanh
      lr: 3.0e-05
    critic:
      hidden_sizes:
      - 64
      - 64
      activation: tanh
      lr: 3.0e-05
  lagrange_cfgs:
    cost_limit: 0.0
    lagrangian_multiplier_init: 0.1
    lambda_lr: 0.05
    lambda_optimizer: Adam
  logger_cfgs:
    use_wandb: false
    wandb_project: omnisafe
    use_tensorboard: true
    save_model_freq: 25
    window_lens: 100
  train_cfgs:
    vector_env_nums: 1
    parallel: 1
